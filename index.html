<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>I Am Creative</title>
    <style>
        /* Modern Reset and Fullscreen Center Layout */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        }

        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #0f172a;
            overflow: hidden;
        }

        /* Ambient Animated Background Glows */
        .bg-glow {
            position: absolute;
            width: 400px;
            height: 400px;
            border-radius: 50%;
            filter: blur(120px);
            opacity: 0.5;
            z-index: 1;
        }

        .glow-1 {
            background: #ec4899;
            top: 20%;
            left: 25%;
        }

        .glow-2 {
            background: #8b5cf6;
            bottom: 20%;
            right: 25%;
        }

        /* Main Container */
        .container {
            position: relative;
            z-index: 2;
            text-align: center;
            padding: 2rem;
        }

        /* Animated Gradient Headline */
        h1 {
            font-size: clamp(3rem, 10vw, 7rem);
            font-weight: 900;
            letter-spacing: -2px;
            background: linear-gradient(135deg, #f43f5e, #8b5cf6, #06b6d4, #10b981);
            background-size: 300% 300%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: gradientShift 6s ease infinite;
        }

        /* Subtitle */
        p {
            color: #94a3b8;
            font-size: 1.25rem;
            margin-top: 1rem;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        /* Keyframe Animations */
        @keyframes gradientShift {
            0% {
                background-position: 0% 50%;
            }
            50% {
                background-position: 100% 50%;
            }
            100% {
                background-position: 0% 50%;
            }
        }
    </style>
</head>
<body>

    <!-- Ambient background elements -->
    <div class="bg-glow glow-1"></div>
    <div class="bg-glow glow-2"></div>

    <!-- Main Content -->
    <div class="container">
        <h1>I AM CREATIVE</h1>
        <p>Design • Art • Innovation</p>
    </div>

</body>
</html>
